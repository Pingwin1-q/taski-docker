# docker-compose.production.yml

volumes:
  pg_data_production:
  static_volume:

# Всё отличие — заменяем build на image и указываем, какой образ использовать
services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    image: pingwin1q/taski_backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/backend_static
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import socket; s=socket.create_connection((''127.0.0.1'', 8000), 2); s.close()"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    image: pingwin1q/taski_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static
    restart: on-failure
  gateway:
    image: pingwin1q/taski_gateway
    env_file: .env
    volumes:
      - static_volume:/staticfiles/
    ports:
      - 8000:80
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
